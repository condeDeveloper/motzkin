name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: Os numeros ate n = 30
        run: mvn -B -ntp -q exec:java -Dexec.args="tabela"

      - name: Todos os caminhos pequenos
        run: mvn -B -ntp -q exec:java -Dexec.args="desenho"

      - name: As tres formulas contra a enumeracao
        run: mvn -B -ntp -q exec:java -Dexec.args="juiz"

      - name: Caminhos por altura maxima
        run: mvn -B -ntp -q exec:java -Dexec.args="altura"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports

  fundo:
    # Ate n = 15 sao quase 22 milhoes de sequencias de passos construidas uma a
    # uma. O job confere cada termo contra a formula e quebra se algum mudar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Enumeracao ate n = 15
        run: mvn -B -ntp -q compile exec:java -Dexec.args="fundo"
